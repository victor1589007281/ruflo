<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude-Go · Cosmic Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">CG</div>
        <div class="brand-text">
          <div class="brand-title">Claude-Go</div>
          <div class="brand-sub">COSMIC</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" data-route="/">
          <span class="nav-icon">⌂</span><span class="nav-label">概览</span>
        </a>
        <a class="nav-item" data-route="/teams">
          <span class="nav-icon">⚙</span><span class="nav-label">团队</span>
        </a>
        <a class="nav-item" data-route="/metrics">
          <span class="nav-icon">∿</span><span class="nav-label">指标中心</span>
        </a>
        <a class="nav-item" data-route="/cron">
          <span class="nav-icon">⏲</span><span class="nav-label">Cron</span>
        </a>
        <a class="nav-item" data-route="/dreaming">
          <span class="nav-icon">☾</span><span class="nav-label">Dreaming</span>
        </a>
        <a class="nav-item" data-route="/evolution">
          <span class="nav-icon">✺</span><span class="nav-label">Evolution</span>
        </a>
        <a class="nav-item" data-route="/swarm">
          <span class="nav-icon">❋</span><span class="nav-label">群体智能</span>
        </a>
        <a class="nav-item" data-route="/tasks">
          <span class="nav-icon">☰</span><span class="nav-label">Tasks</span>
        </a>
        <a class="nav-item" data-route="/workflows">
          <span class="nav-icon">⇌</span><span class="nav-label">工作流</span>
        </a>
        <a class="nav-item" data-route="/backups">
          <span class="nav-icon">⛃</span><span class="nav-label">备份</span>
        </a>
        <a class="nav-item" data-route="/llm">
          <span class="nav-icon">✦</span><span class="nav-label">LLM 监控</span>
        </a>
        <a class="nav-item" data-route="/logs">
          <span class="nav-icon">◉</span><span class="nav-label">实时日志</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div id="health-indicator" class="health">
          <span class="health-dot"></span>
          <span class="health-text">连接中…</span>
        </div>
        <div class="footer-hint">Cosmic · v1.4</div>
      </div>
    </aside>

    <main id="main">
      <header class="topbar">
        <div id="page-title" class="page-title">加载中…</div>
        <div class="topbar-actions">
          <input id="global-search" class="input search" placeholder="全局搜索: 团队名 / objective 语义..." />
          <select id="project-switcher" class="select" title="切换项目">
            <option value="">(当前项目)</option>
          </select>
          <span id="refresh-status" class="muted"></span>
          <!--
            默认: 手动刷新 (auto-refresh OFF). 点击"自动刷新"切换后, 才按当前页面推荐间隔轮询.
            点击"实时"才订阅 SSE. 这样避免用户一直背着高频轮询。
          -->
          <button id="autorefresh-btn" class="btn ghost" title="切换自动刷新: OFF 表示只有手动点刷新才拉新数据">⟳ 自动刷新 OFF</button>
          <button id="stream-btn" class="btn ghost" title="订阅实时推送 (SSE)">实时</button>
          <button id="refresh-btn" class="btn" title="手动刷新当前页面">刷新</button>
        </div>
      </header>
      <div id="view" class="view">
        <div class="loading">加载中…</div>
      </div>
      <div id="toast" class="toast"></div>
    </main>
  </div>
</body>
</html>
