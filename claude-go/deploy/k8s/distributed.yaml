# 分布式模式 (design/02 §四 T2/T3 精简版): 控制面 + worker×2 + llm-gateway 三组件。
# - control-plane: serve 子命令 (:18080 编排控制面 + 任务队列 HTTP 下发)
# - worker: **claude-go-worker 独立二进制** (claude-go 的 worker 子命令仍是回显桩),
#   HTTP 长轮询拉取 stage 任务, 用与单机完全相同的执行路径真跑 (design/02 §3.3)
# - llm-gateway: llm-gateway 子命令 (:18081, design/02 §3.1 R1)
# 冒烟验收: worker 注册可见 / 经控制面提交图任务由 worker 执行 / gateway 代理补全。
#
# cwd 档位 = pvc (design/02 §3.3): 控制面与 worker 挂**同一个** RWX 卷到同一路径
# /workspace, 且双方 cwd 都设成它 —— 缺一不可:
#   ① 编译门禁跑在控制面的 <team.Cwd>/go.mod 上, cwd 不是共享卷就看不见远程产码;
#   ② 工具的执行根是进程级的 (worker 无法逐任务切 cwd), 所以 --workspace 必须
#      等于 --cwd, worker 启动时会强校验这一点并拒绝启动;
#   ③ 卷名 (--workspace-volume) 两侧必须一致, 否则 worker 拉不到任务 (队列按
#      wsvol:<卷名> 标签过滤); 真正证明"同一份数据"的是每个任务的握手文件。
# 换 git 档位 (无 RWX 存储时): 控制面加
#   --workspace-mode git --workspace-git-remote <bare 仓 URL>, worker 加
#   --workspace-mode git; 此时不需要工作区 PVC (但两侧镜像都要有 git, 已装)。
#
# ⚠️ **本清单不含工作区 PVC**, 它引用的是名为 claude-go-teams 的既有 PVC。先 apply
# 二者之一 (PVC 的 spec 建后不可改, 所以刻意不放进本文件, 免得两套清单互相顶):
#   真 RWX 存储类的集群: deploy/k8s/workspace-pvc.yaml
#   单节点 kind/minikube: deploy/k8s/workspace-pvc-kind.yaml   ← kind 已实测
# 忘了建的症状很明确: Pod 卡 Pending, describe 里写 persistentvolumeclaim not found。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-gateway
  namespace: claude-go
spec:
  replicas: 1
  selector:
    matchLabels: { app: claude-go-gateway }
  template:
    metadata:
      labels: { app: claude-go-gateway }
    spec:
      containers:
        - name: gateway
          image: localhost:5000/claude-go:latest
          imagePullPolicy: IfNotPresent
          args: ["llm-gateway", "--addr", "0.0.0.0:18081", "--config", "/etc/claude-go/config.json"]
          env:
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef: { name: claude-go-llm, key: kimi-api-key, optional: true }
          ports: [{ containerPort: 18081 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 18081 }
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/claude-go }
      volumes:
        - name: config
          configMap: { name: claude-go-config }
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-gateway
  namespace: claude-go
spec:
  selector: { app: claude-go-gateway }
  ports: [{ port: 18081, targetPort: 18081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-control
  namespace: claude-go
spec:
  replicas: 1
  selector:
    matchLabels: { app: claude-go-control }
  template:
    metadata:
      labels: { app: claude-go-control }
    spec:
      containers:
        - name: control
          image: localhost:5000/claude-go:latest
          imagePullPolicy: IfNotPresent
          # --cwd 必须指向共享卷: 团队 cwd 就是它 (teams.go:609 Cwd=cfg.Cwd),
          # 编译门禁 (go build ./...) 也在它上面跑。
          args:
            - "serve"
            - "--addr"
            - "0.0.0.0:18080"
            - "--dispatch-mode"
            - "queue"
            - "--cwd"
            - "/workspace"
            - "--workspace-mode"
            - "pvc"
            - "--workspace-volume"
            - "claude-go-teams"
          env:
            - name: CLAUDE_GO_LLM_GATEWAY
              value: "http://claude-go-gateway:18081"
            # L1 网关档位 (pkg/llmgw/remote.go)。**刻意不设 = local 档**:
            # local 档下出站 BaseURL 已被 ApplyGatewayOverride 改指上面那个网关,
            # 字节照样经网关 (k8s-e2e.sh 第 9 步断言的就是这条); 而进程内仍保留
            # 重试/熔断/fallback。
            # 打开下面这行改为 remote 档 = 本进程不再重试/熔断/持有 provider 凭据,
            # 全部集中到网关进程。这是**可感知的行为变更**, 要与网关侧的重试/熔断
            # 能力一起上线, 故默认不开。
            # - name: CLAUDE_GO_LLM_GATEWAY_MODE
            #   value: "remote"
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef: { name: claude-go-llm, key: kimi-api-key, optional: true }
          ports: [{ containerPort: 18080 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 18080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: config, mountPath: /etc/claude-go }
            # 团队工作区: 与 worker 同一个卷、同一个路径 (pvc 档的全部意义)。
            # 刻意与状态卷分开: 状态目录用 FileStore, 它**没有跨进程锁**
            # (design/02 §3.4.1) —— 共享状态目录会丢更新, 共享工作区才是要的。
            - { name: teams, mountPath: /workspace }
      volumes:
        - name: state
          emptyDir: {}
        - name: config
          configMap: { name: claude-go-config }
        - name: teams
          persistentVolumeClaim: { claimName: claude-go-teams }
---
# 只读 dashboard (design/02 §3.5 L5): 与控制面**分开部署**, 出站动作经
# CLAUDE_GO_BOT_API_URL 转发给控制面而不是硬编码回环。
#
# 为什么要有这个 pod: 那个覆盖变量此前**没有任何部署清单设置它** —— 代码路径活着但
# 拓扑里没有它的消费方, 属"建成未通电"。加它的同时必须能验证转发真的生效, 否则就只是
# 又一个装饰品。验证方式见 deploy/k8s-e2e.sh 的 dashboard 转发检查。
#
# 刻意不给它 KIMI_API_KEY: 只读面板不该有 LLM 凭据。它需要 LLM 的那几个端点
# (/api/workflows/generate 等) 本来就该转发给控制面执行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-dashboard
  namespace: claude-go
spec:
  replicas: 1
  selector:
    matchLabels: { app: claude-go-dashboard }
  template:
    metadata:
      labels: { app: claude-go-dashboard }
    spec:
      containers:
        - name: dashboard
          image: localhost:5000/claude-go:latest
          imagePullPolicy: IfNotPresent
          args: ["dashboard", "run", "--addr", "0.0.0.0:7777", "--no-open"]
          env:
            # 出站动作转发目标 = 控制面。没有它时 dashboard 会拼 127.0.0.1:<port>,
            # 在独立 pod 里那是自己, 动作永远送不出去。
            - name: CLAUDE_GO_BOT_API_URL
              value: "http://claude-go-control:18080"
          ports: [{ containerPort: 7777 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 7777 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: config, mountPath: /etc/claude-go }
      volumes:
        # 只读面板与控制面**不共享**状态卷: 它读的是经 HTTP 拿到的控制面数据,
        # 挂同一个卷会让人误以为它能直接改控制面的状态。
        - name: state
          emptyDir: {}
        - name: config
          configMap: { name: claude-go-config }
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-dashboard
  namespace: claude-go
spec:
  selector: { app: claude-go-dashboard }
  ports: [{ port: 7777, targetPort: 7777 }]
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-control
  namespace: claude-go
spec:
  selector: { app: claude-go-control }
  ports: [{ port: 18080, targetPort: 18080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-worker
  namespace: claude-go
spec:
  replicas: 2
  selector:
    matchLabels: { app: claude-go-worker }
  template:
    metadata:
      labels: { app: claude-go-worker }
    spec:
      containers:
        - name: worker
          image: localhost:5000/claude-go:latest
          imagePullPolicy: IfNotPresent
          # 真执行体 = 独立二进制 (claude-go 的 worker 子命令仍是回显 payload 的桩)。
          command: ["/usr/local/bin/claude-go-worker"]
          # --workspace 必须与 --cwd 一致: 工具的执行根是进程级的, worker 无法逐任务
          # 切 cwd —— 不一致时 Agent 会把文件写到 cwd 而工作区里什么都没有。
          # 启动时强校验, 不一致直接拒绝启动 (cmd/claude-go-worker/main.go)。
          args:
            - "--control"
            - "http://claude-go-control:18080"
            - "--config"
            - "/etc/claude-go/config.json"
            - "--cwd"
            - "/workspace"
            - "--workspace"
            - "/workspace"
            - "--workspace-mode"
            - "pvc"
            - "--workspace-volume"
            - "claude-go-teams"
          env:
            - name: CLAUDE_GO_LLM_GATEWAY
              value: "http://claude-go-gateway:18081"
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef: { name: claude-go-llm, key: kimi-api-key, optional: true }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # 状态目录必须**每个 worker 独立** (FileStore 无跨进程锁), 所以给它自己的
            # emptyDir 而不是共享卷。共享的只有团队工作区。
            - name: CLAUDE_GO_STATE_DIR
              value: "/data/.claude-go"
          volumeMounts:
            - { name: config, mountPath: /etc/claude-go }
            - { name: state, mountPath: /data }
            - { name: teams, mountPath: /workspace }
      volumes:
        - name: config
          configMap: { name: claude-go-config }
        - name: state
          emptyDir: {}
        - name: teams
          persistentVolumeClaim: { claimName: claude-go-teams }
