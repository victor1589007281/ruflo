# claude-go 分布式部署 —— hakit agents ns (2026-08-16)。
# 拓扑 (deploy/k8s/distributed.yaml 的 hakit 适配版):
#   gateway (llm-gateway :18081) → control (serve 队列编排 :18080) → worker×2 (真执行体)
#   dashboard (:7777 只读面板) + codeintel-mcp (:29234) + agentdb (:9090, 单独清单)
# 适配点:
#   - 镜像 claude-go:agents3-* (ruflo 仓最新编译, 含方案三 + 双写)
#   - 状态/工作区全部落宿主 /mnt/data (bindmnt 注入节点的 hostPath)
#   - control+worker: statestore dual 双写 (文件 + agentdb), 读 fallback (agentdb 优先)
#   - 状态卷纪律保留: 每组件独立 state (FileStore 无跨进程锁), 共享的只有 /workspace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-gateway
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: claude-go-gateway }
  template:
    metadata:
      labels: { app: claude-go-gateway }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: gateway
          image: claude-go:agents-20261125-0048
          imagePullPolicy: Never
          # anthropic-gateway (协议翻译/透传, omen 长推理 30min + x-opencode-session
          # 注入) + pathfix (18081→18085, 兼容老客户端 /messages 路径改写)。
          # 注意: claude-go 内部客户端 (CLAUDE_GO_LLM_GATEWAY) 会用裸路径
          # /messages 与 /chat/completions, anthropic-gateway 必须原生注册这两组
          # 路由 (omen3 起支持) —— 只开 /v1/messages 会让团队作业 LLM 调用裸 404
          # (interviewforge 增量出题 "超过最大重试次数" 事故根因)。
          command: ["/bin/sh", "-c"]
          args:
            - "python3 /usr/local/bin/pathfix.py >>/tmp/pathfix.log 2>&1 & exec /usr/local/bin/anthropic-gateway --addr 127.0.0.1:18085 --config /etc/claude-go/config.json --default-prefix opencode --upstream-timeout 30m"
          env:
            - { name: HOME, value: "/tmp" }
            - { name: SEARCH_STATE_DIR, value: "/mnt/data/claude-go/search" }
            # Jev 决策层：pod 内 127.0.0.1 不是宿主，改走 kind 网桥网关。
            - { name: CLAUDE_GO_DECISION_URL, value: "http://172.18.0.1:11435" }
          ports: [{ containerPort: 18081 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 18081 }
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/claude-go }
      volumes:
        - name: config
          configMap: { name: agents-config }
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-gateway
  namespace: agents
spec:
  selector: { app: claude-go-gateway }
  ports: [{ port: 18081, targetPort: 18081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-control
  namespace: agents
spec:
  replicas: 1
  strategy: { type: Recreate } # hostPath 单点
  selector:
    matchLabels: { app: claude-go-control }
  template:
    metadata:
      labels: { app: claude-go-control }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: control
          image: claude-go:agents-20261125-0048
          imagePullPolicy: Never
          args:
            - "serve"
            - "--addr"
            - "0.0.0.0:18080"
            - "--config"
            - "/etc/claude-go/config.json"
            - "--dispatch-mode"
            - "queue"
            - "--cwd"
            - "/workspace"
            - "--workspace-mode"
            - "pvc"
            - "--workspace-volume"
            - "claude-go-teams"
          env:
            - name: CLAUDE_GO_LLM_GATEWAY
              value: "http://claude-go-gateway:18081"
            - { name: CLAUDE_GO_STATESTORE_BACKEND, value: "dual" }
            - { name: CLAUDE_GO_STATESTORE_READ, value: "fallback" }
            - { name: CLAUDE_GO_AGENTDB_URL, value: "http://agentdb:9090" }
            - { name: CLAUDE_GO_TOOLS_POOL, value: "1" }
            - { name: HOME, value: "/tmp" }
            - { name: SEARCH_STATE_DIR, value: "/mnt/data/claude-go/search" }
            - { name: GIT_SSH_COMMAND, value: "ssh -i /home/victor/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/home/victor/.ssh/known_hosts" }
            - { name: CLAUDE_GO_DECISION_URL, value: "http://172.18.0.1:11435" }
            # 经验库共享存储：一条经验一个 key，rollout 不再清零、多副本合并。
            - { name: CLAUDE_GO_EXPERIENCE_STORE, value: "agentdb" }
            - { name: CLAUDE_GO_EXPERIENCE_BUCKET, value: "claude-go-experience" }
          ports: [{ containerPort: 18080 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 18080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: state, mountPath: /mnt/data/claude-go }
            - { name: config, mountPath: /etc/claude-go }
            - { name: teams, mountPath: /workspace }
            - { name: teams-visible, mountPath: /home/victor/.claude-go/teams }
            - { name: knowledge, mountPath: /home/victor/base/git/gitee/knowledge }
            - { name: code-git, mountPath: /home/victor/base/git }
            - { name: ima-skill, mountPath: /home/victor/.claude/skills/ima-skill, readOnly: true }
            - { name: ssh, mountPath: /home/victor/.ssh, readOnly: true }
      volumes:
        - name: state
          hostPath:
            path: /mnt/data/claude-go
            type: Directory
        - name: teams-visible
          hostPath:
            path: /home/victor/.claude-go/teams
            type: DirectoryOrCreate

        - name: config
          configMap: { name: agents-config }
        - name: teams
          hostPath:
            path: /mnt/data/claude-go/workspace
            type: DirectoryOrCreate

        # knowledge 与下面的 ima-skill 同一条教训: hostPath 在节点文件系统上解析,
        # 宿主 /home/victor 在 kind 节点里是个空壳 —— 2026-11-15 实测节点上
        # /home/victor/base/git/gitee/knowledge 是 root:root 空目录 (DirectoryOrCreate
        # 建的), 容器内不可写, 于是 cron "IMA 笔记同步" 报
        # "创建 raw 目录失败: mkdir raw: permission denied" (sync.knowledgeRepo 为空
        # 时路径退化成相对 cwd; 补上绝对路径后仍会因空壳目录失败)。
        # 数据实际放在 state 卷 (节点与宿主同一份设备) 的 knowledge/ 下,
        # 宿主侧 /home/victor/base/git/gitee/knowledge 是指向它的符号链接,
        # 因此 mountPath 仍保持原路径, 配置 (wiki.repos / sync.knowledgeRepo) 不用改。
        # 恢复节点 bind 的方案见 claude-go-hakit-net.sh (需 root)。
        - name: knowledge
          hostPath:
            path: /mnt/data/claude-go/knowledge
            type: Directory
        # ima-skill 的 hostPath **不能**写 /home/victor/.claude/skills/ima-skill:
        # hostPath 是在 kubelet 所在节点的文件系统上解析的, 而 kind 节点自己的
        # /home/victor 与宿主那份同名目录互不相干 (2026-10-10 实测: 节点上这个目录
        # 只有 . 和 .., mtime Aug 16 —— 从建集群起就没被填过的空壳)。于是容器里
        # /home/victor/.claude/skills/ima-skill 恒为空, IMAAdapter 硬编码该路径时
        # node 报 MODULE_NOT_FOUND, cron-1 "IMA 笔记同步" 90 次挂 56 次。
        # state 卷同源的 /mnt/data 是节点与宿主同一份真实设备 (/dev/nvme1n1p1),
        # 其中 skills/ima-skill/ima_api.cjs 已实测 md5 与宿主逐字节一致。
        # 改指向那里: 容器内挂载点不变, 改的只是**源**, 不动代码里的任何路径。
        - name: ima-skill
          hostPath:
            path: /mnt/data/claude-go/skills/ima-skill
            type: Directory
        # 宿主代码目录（外部仓库都在 /home/victor/base/git）。
        # 源必须是 /mnt/data 下的 bind：hostPath 在 kind 节点里解析，而节点容器的
        # /home/victor 是另一份空壳（实测只有 kubelet 建的空目录）。宿主侧由
        # claude-go-code-bind.service（Before=docker.service）在开机时把
        # /home/victor/base/git bind 到 /mnt/data/claude-go/code/git。
        # mountPath 仍写原路径 —— 容器里看到的路径与宿主逐字一致，代码/配置零改动。
        - name: code-git
          hostPath:
            path: /mnt/data/claude-go/code/git
            type: Directory
        - name: ssh
          hostPath:
            path: /home/victor/.ssh
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-control
  namespace: agents
spec:
  selector: { app: claude-go-control }
  ports:
    - { name: http, port: 18080, targetPort: 18080, nodePort: 31080 }
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-dashboard
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: claude-go-dashboard }
  template:
    metadata:
      labels: { app: claude-go-dashboard }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: dashboard
          image: claude-go:agents-20261125-0048
          imagePullPolicy: Never
          args: ["dashboard", "run", "--addr", "0.0.0.0:7777", "--no-open", "--config", "/etc/claude-go/config.json"]
          env:
            - name: CLAUDE_GO_BOT_API_URL
              value: "http://claude-go-control:18080"
            # Jev 决策流水从 agentdb 读, 缺了 /api/jev/stats 只回报错 (2026-11-05 实测)
            - { name: CLAUDE_GO_AGENTDB_URL, value: "http://agentdb:9090" }
            - { name: HOME, value: "/tmp" }
            - { name: SEARCH_STATE_DIR, value: "/mnt/data/claude-go/search" }
            # 群体智能/经验的只读展示同样走 agentDB
            - { name: SWARM_STORE, value: "agentdb" }
            - { name: AGENTDB_URL, value: "http://agentdb:9090" }
            - { name: AGENTDB_NAMESPACE, value: "swarm" }
            - { name: CLAUDE_GO_EXPERIENCE_STORE, value: "agentdb" }
            - { name: CLAUDE_GO_EXPERIENCE_BUCKET, value: "claude-go-experience" }
          ports: [{ containerPort: 7777 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 7777 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: config, mountPath: /etc/claude-go }
      volumes:
        # 只读面板与控制面不共享状态卷 (经 HTTP 读控制面)
        - name: state
          emptyDir: {}
        - name: config
          configMap: { name: agents-config }
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-dashboard
  namespace: agents
spec:
  selector: { app: claude-go-dashboard }
  ports:
    - { name: http, port: 7777, targetPort: 7777, nodePort: 31777 }
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-worker
  namespace: agents
spec:
  replicas: 2
  selector:
    matchLabels: { app: claude-go-worker }
  template:
    metadata:
      labels: { app: claude-go-worker }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      # hostPath 卷不吃 fsGroup: kubelet 以 root 建 subPathExpr 子目录, uid 1000
      # 的主容器 mkdir /data/.claude-go 直接 permission denied (agents9 实测)。
      # initContainer 以 root 预建并把属主交给 1000:1000。
      initContainers:
        - name: init-state-dir
          # 不用 busybox: kind 节点无外网, docker.io 拉不动 (agents9 实测 ImagePullBackOff)。
          # agents9 基于 debian-slim 自带 sh+chown, 直接复用镜像内已有能力。
          # 只跑 mkdir/chown，不跟随主容器升级（跟随会平白多一次 init 镜像变更）。
          image: claude-go:agents-20261114-110955
          imagePullPolicy: Never
          # 显式 root: 否则继承 pod 级 runAsUser 1000, chown 反向被拒 (agents9 实测 Init:Error)。
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          command: ["sh", "-c", "mkdir -p /data/.claude-go && chown -R 1000:1000 /data"]
          volumeMounts:
            - { name: state, mountPath: /data, subPathExpr: "$(POD_NAME)" }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
      containers:
        - name: worker
          image: claude-go:agents-20261125-0048
          imagePullPolicy: Never
          command: ["/usr/local/bin/claude-go-worker"]
          args:
            - "--control"
            - "http://claude-go-control:18080"
            - "--config"
            - "/etc/claude-go/config.json"
            - "--cwd"
            - "/workspace"
            - "--workspace"
            - "/workspace"
            - "--workspace-mode"
            - "pvc"
            - "--workspace-volume"
            - "claude-go-teams"
          env:
            - name: CLAUDE_GO_LLM_GATEWAY
              value: "http://claude-go-gateway:18081"
            - { name: CLAUDE_GO_STATESTORE_BACKEND, value: "dual" }
            - { name: CLAUDE_GO_STATESTORE_READ, value: "fallback" }
            - { name: CLAUDE_GO_AGENTDB_URL, value: "http://agentdb:9090" }
            # swarm v3: 群体智能存储走 agentDB (SWARM_STORE=agentdb; jsonl=降级开关)
            - { name: SWARM_STORE, value: "agentdb" }
            - { name: AGENTDB_URL, value: "http://agentdb:9090" }
            - { name: AGENTDB_NAMESPACE, value: "swarm" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # 状态目录每 worker 独立 (FileStore 无跨进程锁), 卷为 hostPath 常驻卷 +
            # subPathExpr 按 POD_NAME 切子目录: 持久 (pod 重建不丢 skills/metrics/
            # evolution 账本/trace span/bandit 状态) 与独立兼得。
            - name: CLAUDE_GO_STATE_DIR
              value: "/data/.claude-go"
            - { name: HOME, value: "/tmp" }
            - { name: SEARCH_STATE_DIR, value: "/mnt/data/claude-go/search" }
            - { name: CLAUDE_GO_TOOLS_POOL, value: "1" }
            - { name: CLAUDE_GO_DECISION_URL, value: "http://172.18.0.1:11435" }
            # 宿主上的 DiagramForge（海报流水线 poster-kit 的默认是 127.0.0.1:4900，
            # 在 Pod 里指向 Pod 自己）。走 selector-less Service + EndpointSlice
            # 指向宿主在 docker 网桥上的 172.18.0.1，Pod 侧不出现裸 IP。
            - { name: DF_BASE, value: "http://diagramforge:4900" }
            # 经验库共享存储：worker 状态卷按 pod 名隔离，只有共享库能跨 rollout 累积。
            - { name: CLAUDE_GO_EXPERIENCE_STORE, value: "agentdb" }
            - { name: CLAUDE_GO_EXPERIENCE_BUCKET, value: "claude-go-experience" }
          volumeMounts:
            - { name: config, mountPath: /etc/claude-go }
            - { name: state, mountPath: /data, subPathExpr: "$(POD_NAME)" }
            - { name: teams, mountPath: /workspace }
            - { name: teams-visible, mountPath: /home/victor/.claude-go/teams }
            - { name: code-git, mountPath: /home/victor/base/git }
      volumes:
        - name: config
          configMap: { name: agents-config-worker }
        - name: state
          hostPath:
            path: /mnt/data/claude-go-worker
            type: DirectoryOrCreate
        - name: teams
          hostPath:
            path: /mnt/data/claude-go/workspace
            type: DirectoryOrCreate
        - name: teams-visible
          hostPath:
            path: /home/victor/.claude-go/teams
            type: DirectoryOrCreate
        # 与 control 同一个源：宿主代码树（见上面 code-git 的注释）。
        - name: code-git
          hostPath:
            path: /mnt/data/claude-go/code/git
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-go-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: claude-go-mcp }
  template:
    metadata:
      labels: { app: claude-go-mcp }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: mcp
          image: claude-go:agents-20261125-0048
          imagePullPolicy: Never
          args: ["codeintel-mcp-server", "--transport", "http", "--addr", "0.0.0.0:29234", "--config", "/etc/claude-go/config.json"]
          env:
            - { name: HOME, value: "/tmp" }
            - { name: SEARCH_STATE_DIR, value: "/mnt/data/claude-go/search" }
            - { name: CLAUDE_GO_DECISION_URL, value: "http://172.18.0.1:11435" }
          ports: [{ containerPort: 29234 }]
          resources:
            limits: { cpu: "4", memory: 8Gi }
            requests: { cpu: "500m", memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/claude-go }
            - { mountPath: /mnt/data/claude-go, name: cgdata }
      volumes:
        - name: config
          configMap: { name: agents-config }
        - name: cgdata
          hostPath:
            path: /mnt/data/claude-go
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: claude-go-mcp
  namespace: agents
spec:
  selector: { app: claude-go-mcp }
  ports:
    - { name: http, port: 29234, targetPort: 29234, nodePort: 31234 }
  type: NodePort
---
# ---------------------------------------------------------------- 集群外服务入口
# 宿主上跑着两个 Pod 需要用的服务：DiagramForge (:4900) 与 codeintel MCP (:9235)。
# Pod 里的 127.0.0.1 是 Pod 自己，所以必须经「集群内名字 → 宿主地址」这一跳。
#
# 做法是 selector-less Service + 手写 EndpointSlice（v1.36 起 v1 Endpoints 已弃用，
# 且要靠 mirroring 才转成 Slice；直接写 Slice 少一层）。名字进 DNS：
#   diagramforge.agents.svc.cluster.local:4900
#   codeintel-mcp.agents.svc.cluster.local:9235
# 地址 172.18.0.1 = 宿主在 docker 网桥上的地址（kind 节点容器在 br-5c8304a9cc21 上）；
# 宿主 ufw 默认 deny incoming，已按既有 ollama 先例放行 172.18.0.0/16 与 10.244.0.0/24
# 访问这两个端口（见 `ufw status` 里带 "kind" 注释的规则）。
# 注意：Service 不带 selector —— 带了就会去匹配 Pod，而这没有 Pod 可匹配。
apiVersion: v1
kind: Service
metadata:
  name: diagramforge
  namespace: agents
spec:
  ports:
    - { name: http, port: 4900, targetPort: 4900 }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: diagramforge-host
  namespace: agents
  labels:
    kubernetes.io/service-name: diagramforge
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - { name: http, port: 4900, protocol: TCP }
endpoints:
  - addresses: ["172.18.0.1"]
    conditions: { ready: true }
---
apiVersion: v1
kind: Service
metadata:
  name: codeintel-mcp
  namespace: agents
spec:
  ports:
    - { name: http, port: 9235, targetPort: 9235 }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: codeintel-mcp-host
  namespace: agents
  labels:
    kubernetes.io/service-name: codeintel-mcp
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - { name: http, port: 9235, protocol: TCP }
endpoints:
  - addresses: ["172.18.0.1"]
    conditions: { ready: true }
